# Example SSHJumper configuration (structured hop format)
#
# Copy to ~/.ssh/sshjumper/sshjconfig.yml and customize.
#
# Optional grouping fields for the TUI:
#   environment: prod | staging | demo | ...
#   project: app | db | api | ...
# If omitted, servers appear under the "Generic" group.

prod_db:
  description: production database
  environment: prod
  project: db
  keep_alive: true
  terminal: true
  remotecommand: sudo su -

  hop1:
    host: bastion.example.com
    user: ubuntu
    key: bastion.pem

  hop2:
    host: 10.0.1.20
    user: dbadmin

bastion:
  description: development jump host
  keep_alive: true
  terminal: true
  x11: false
  quiet: false

  hop1:
    host: jump.example.com
    user: devops
    port: 22
    key: jump.pem

staging_app:
  description: staging application server
  environment: staging
  project: app
  keep_alive: true

  hop1:
    host: bastion.example.com
    user: ubuntu
    key: bastion.pem

  hop2:
    host: 10.0.2.15
    user: appuser
    key: staging_app.pem

  hop3:
    host: 10.0.2.30
    user: deploy

demo_api:
  description: demo API sandbox
  environment: demo
  project: api
  keep_alive: true

  hop1:
    host: demo-bastion.example.com
    user: demo
    key: demo_bastion.pem

  hop2:
    host: 10.0.3.40
    user: apiuser

prod_worker:
  description: production background worker
  environment: prod
  project: app
  keep_alive: true

  hop1:
    host: bastion.example.com
    user: ubuntu
    key: bastion.pem

  hop2:
    host: 10.0.4.12
    user: worker

web01:
  description: uncategorized host (no environment or project)
  keep_alive: true

  hop1:
    host: web01.example.com
    user: admin
