# Example SSHJumper configuration (structured hop format)
#
# Copy to ~/.ssh/sshjumper/sshjconfig.yml and customize.
#
# System / meta sections use a leading underscore so they never collide
# with connectable server names:
#   _global:   defaults for every server (per-server keys still win)
#   _hosts:    reusable hop templates
#
# Legacy aliases still work: global: / hosts:
#
# Optional grouping fields for the TUI:
#   environment: prod | staging | demo | ...
#   project: app | db | api | ...
# If omitted, servers appear under the "Generic" group.

_global:
  keep_alive: true
  terminal: true

_hosts:
  prod_bastion:
    host: bastion.example.com
    user: ubuntu
    key: bastion.pem

  demo_bastion:
    host: demo-bastion.example.com
    user: demo
    key: demo_bastion.pem

  jump_dev:
    host: jump.example.com
    user: devops
    port: 22
    key: jump.pem

prod_db:
  description: production database
  environment: prod
  project: db
  remotecommand: sudo su -
  # Local port forwards, used only with: sshjumper -P prod_db
  port_forward: 3000:3306     # localhost:3000 -> final host (10.0.1.20):3306

  hop1: prod_bastion
  hop2:
    host: 10.0.1.20
    user: dbadmin
    # hop-level forward targets this hop; also accepts a list or LOCAL:HOST:REMOTE
    # port_forward: 3006:3306

bastion:
  description: development jump host
  x11: false
  quiet: false

  hop1: jump_dev

staging_app:
  description: staging application server
  environment: staging
  project: app

  hop1: prod_bastion
  hop2:
    host: 10.0.2.15
    user: appuser
    key: staging_app.pem
  hop3:
    host: 10.0.2.30
    user: deploy

demo_api:
  description: demo API sandbox
  environment: demo
  project: api

  hop1: demo_bastion
  hop2:
    host: 10.0.3.40
    user: apiuser

prod_worker:
  description: production background worker
  environment: prod
  project: app

  # Reference + optional field override
  hop1:
    use: prod_bastion
    port: 22
  hop2:
    host: 10.0.4.12
    user: worker

web01:
  description: uncategorized host (no environment or project)
  # Opt out of _global keep_alive for this server only:
  keep_alive: false

  hop1:
    host: web01.example.com
    user: admin
